spring.application.name=isa-nfce-lab
server.port=${PORT:${SERVER_PORT:8081}}
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=${APP_TIMEZONE:America/Sao_Paulo}
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:America/Sao_Paulo}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5000,http://127.0.0.1:5000}

app.h2.path=${APP_H2_PATH:}
app.h2.username=${APP_H2_USERNAME:sa}
app.h2.password=${APP_H2_PASSWORD:}

app.nfce.ws-enabled=${APP_NFCE_WS_ENABLED:true}
app.nfce.documentos.output-dir=${APP_NFCE_DOCUMENTOS_OUTPUT_DIR:documentos-fiscais}
app.nfce.documentos.pdf-provider=${APP_NFCE_DOCUMENTOS_PDF_PROVIDER:MEUDANFE}
app.nfce.documentos.meudanfe.base-url=${APP_NFCE_DOCUMENTOS_MEUDANFE_BASE_URL:https://api.meudanfe.com.br/v2}
app.nfce.documentos.meudanfe.api-key=${APP_NFCE_DOCUMENTOS_MEUDANFE_API_KEY:}
app.nfce.documentos.meudanfe.timeout-seconds=${APP_NFCE_DOCUMENTOS_MEUDANFE_TIMEOUT_SECONDS:30}
app.nfce.documentos.r2.enabled=${APP_NFCE_DOCUMENTOS_R2_ENABLED:false}
app.nfce.documentos.r2.account-id=${APP_NFCE_DOCUMENTOS_R2_ACCOUNT_ID:}
app.nfce.documentos.r2.api-token=${APP_NFCE_DOCUMENTOS_R2_API_TOKEN:}
app.nfce.documentos.r2.endpoint=${APP_NFCE_DOCUMENTOS_R2_ENDPOINT:}
app.nfce.documentos.r2.bucket=${APP_NFCE_DOCUMENTOS_R2_BUCKET:}
app.nfce.documentos.r2.access-key-id=${APP_NFCE_DOCUMENTOS_R2_ACCESS_KEY_ID:}
app.nfce.documentos.r2.secret-access-key=${APP_NFCE_DOCUMENTOS_R2_SECRET_ACCESS_KEY:}
app.nfce.documentos.r2.region=${APP_NFCE_DOCUMENTOS_R2_REGION:auto}
app.nfce.documentos.r2.key-prefix=${APP_NFCE_DOCUMENTOS_R2_KEY_PREFIX:notas}
app.integracoes.brasilapi.base-url=${APP_INTEGRACOES_BRASILAPI_BASE_URL:https://brasilapi.com.br/api}
app.integracoes.brasilapi.timeout-seconds=${APP_INTEGRACOES_BRASILAPI_TIMEOUT_SECONDS:10}
app.integracoes.viacep.base-url=${APP_INTEGRACOES_VIACEP_BASE_URL:https://viacep.com.br/ws}
app.integracoes.viacep.timeout-seconds=${APP_INTEGRACOES_VIACEP_TIMEOUT_SECONDS:10}
app.integracoes.pdv.token=${APP_INTEGRACOES_PDV_TOKEN:}

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.auth-cookie.name=${AUTH_COOKIE_NAME:isa_nfce_auth_token}
app.security.auth-cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.security.auth-cookie.secure=${AUTH_COOKIE_SECURE:true}
app.security.bootstrap-admin.enabled=${APP_SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.login=${APP_SECURITY_BOOTSTRAP_ADMIN_LOGIN:admin}
app.security.bootstrap-admin.name=${APP_SECURITY_BOOTSTRAP_ADMIN_NAME:Administrador}
app.security.bootstrap-admin.password=${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
app.security.login-attempt.max-failures=${LOGIN_ATTEMPT_MAX_FAILURES:5}
app.security.login-attempt.lockout-minutes=${LOGIN_ATTEMPT_LOCKOUT_MINUTES:15}

# Propriedades fiscais legadas usadas para bootstrap automatico da primeira empresa no banco.
# Em producao, prefira migrar empresas reais e deixar estes campos vazios para nao criar emitente incorreto.
nfe.modelo=${NFE_MODELO:}
nfe.ambiente=${NFE_AMBIENTE:}
nfe.uf=${NFE_UF:}
nfe.certificado.pfx-path=${NFE_CERTIFICADO_PFX_PATH:}
nfe.certificado.senha=${NFE_CERTIFICADO_SENHA:}
nfe.cadeia.jks-path=${NFE_CADEIA_JKS_PATH:}
nfe.cadeia.senha=${NFE_CADEIA_SENHA:}
nfe.csc=${NFE_CSC:}
nfe.csc-id=${NFE_CSC_ID:0}

nfe.emitente.cnpj=${NFE_EMITENTE_CNPJ:}
nfe.emitente.razao-social=${NFE_EMITENTE_RAZAO_SOCIAL:}
nfe.emitente.nome-fantasia=${NFE_EMITENTE_NOME_FANTASIA:}
nfe.emitente.inscricao-estadual=${NFE_EMITENTE_INSCRICAO_ESTADUAL:}
nfe.emitente.serie=${NFE_EMITENTE_SERIE:}
nfe.emitente.natureza-operacao=${NFE_EMITENTE_NATUREZA_OPERACAO:}
nfe.emitente.cep=${NFE_EMITENTE_CEP:}
nfe.emitente.logradouro=${NFE_EMITENTE_LOGRADOURO:}
nfe.emitente.numero=${NFE_EMITENTE_NUMERO:}
nfe.emitente.bairro=${NFE_EMITENTE_BAIRRO:}
nfe.emitente.codigo-municipio=${NFE_EMITENTE_CODIGO_MUNICIPIO:}
nfe.emitente.descricao-municipio=${NFE_EMITENTE_DESCRICAO_MUNICIPIO:}
