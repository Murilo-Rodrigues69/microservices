spring.application.name=isa
server.port=${PORT:8080}
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.disable-swagger-default-url=true
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}
app.security.seed-default-users=false
app.security.bootstrap-admin.enabled=${APP_SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.login=${APP_SECURITY_BOOTSTRAP_ADMIN_LOGIN:admin}
app.security.bootstrap-admin.name=${APP_SECURITY_BOOTSTRAP_ADMIN_NAME:Administrador}
app.security.bootstrap-admin.password=${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap-admin.store-code=${APP_SECURITY_BOOTSTRAP_ADMIN_STORE_CODE:MATRIZ}
app.security.bootstrap-admin.store-name=${APP_SECURITY_BOOTSTRAP_ADMIN_STORE_NAME:Loja Matriz}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.integracoes.fiscal.base-url=${FISCAL_BASE_URL:http://localhost:8081}
app.integracoes.fiscal.token=${FISCAL_TOKEN:}
app.integracoes.fiscal.connect-timeout-seconds=${FISCAL_CONNECT_TIMEOUT_SECONDS:5}
app.integracoes.fiscal.read-timeout-seconds=${FISCAL_READ_TIMEOUT_SECONDS:30}
app.integracoes.whatsapp.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com}
app.integracoes.whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
app.integracoes.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.integracoes.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.integracoes.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.integracoes.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.integracoes.whatsapp.connect-timeout-seconds=${WHATSAPP_CONNECT_TIMEOUT_SECONDS:5}
app.integracoes.whatsapp.read-timeout-seconds=${WHATSAPP_READ_TIMEOUT_SECONDS:30}