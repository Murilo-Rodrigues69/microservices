




server.port=${PORT:8080}


spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.h2.console.enabled=false
spring.h2.console.path=/h2-console


spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}
app.security.auth-cookie.secure=false
app.security.auth-cookie.same-site=Lax


logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG




app.security.seed-default-users=false
