
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${APP_TIMEZONE:America/Sao_Paulo}}
spring.datasource.username=${DB_USER:${MYSQLUSER}}
spring.datasource.password=${DB_PASS:${MYSQLPASSWORD}}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=${APP_TIMEZONE:America/Sao_Paulo}
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:America/Sao_Paulo}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true


spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
app.security.auth-cookie.secure=true
app.security.auth-cookie.same-site=None

app.security.seed-default-users=false


server.port=${PORT:8080}
app.integracoes.fiscal.base-url=${FISCAL_BASE_URL:http://localhost:8081}
app.integracoes.fiscal.token=${FISCAL_TOKEN:}
app.integracoes.fiscal.connect-timeout-seconds=${FISCAL_CONNECT_TIMEOUT_SECONDS:5}
app.integracoes.fiscal.read-timeout-seconds=${FISCAL_READ_TIMEOUT_SECONDS:30}
