server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.h2.console.enabled=true

debug=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect





spring.app.jwtSecret=ZGV2LXRlc3Qtc2VjcmV0LWRldi10ZXN0LXNlY3JldC1kZXYtdGVzdC1zZWNyZXQ=
spring.app.jwtExpirationMs=3600000
app.security.auth-cookie.secure=false
app.security.auth-cookie.same-site=Lax

app.security.seed-default-users=true

app.security.test-seed-user-password=password1
app.security.test-seed-admin-password=admin10
